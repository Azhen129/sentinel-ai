[project]
name = "sentinel-ai-public-demo"
version = "1.0.0"
requires-python = "==3.12.*"
# Runtime pins match requirements.txt; local development keeps that full file.
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.14.1",
  "numpy==2.2.5",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "joblib==1.4.2",
]

[tool.vercel]
entrypoint = "deployment.public_app:app"

[tool.vercel.scripts]
build = "python deployment/build.py"

[tool.vercel.fastapi.static]
# All promoted static files are the reviewed synthetic console, with no secrets.
# API requests retain the existing application middleware and read-only checks.
cdn = true
