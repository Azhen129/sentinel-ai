name: Verify Sentinel AI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Verify the included model artifact
        run: python -c "from detection.ml import Detector; detector = Detector(); assert detector.ready, 'The included model artifact and evaluation metadata must load together'"
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: python3 ../scripts/generate_notices.py --check
      - name: Verify owned-source license ships with the frontend
        run: python3 -c "from pathlib import Path; assert Path('../LICENSE').read_text() == Path('public/LICENSE.txt').read_text()"
      - run: npm run build
